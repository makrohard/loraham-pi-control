# tests/coverage_matrix.toml — machine-readable coverage of the lab-composed surface
# (lhpc routes + the /testlab blueprint, lhpc CLI + the lab CLI, forms, stacks). Every
# surface id MUST carry a class; the gate fails on drift. Classes differ in DEPTH — this
# matrix accounts for coverage, it does NOT claim every function is fully exercised:
#   "acceptance"          driven against the RUNNING app/executable; effect verified.
#   "sweep"               route EXISTS + CSRF-enforced (POST) or renders w/o mutating
#                         (parameterless GET). The action's EFFECT is NOT asserted.
#   { limitation="..." }  documented gap; the reason states in-process-covered vs deferred.
# `grep limitation` lists every gap. See docs/testlab.md for the depth breakdown.

