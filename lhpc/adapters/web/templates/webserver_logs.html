{% extends "_log_page.html" %}
{# LHPC-managed nginx front-end logs (on disk under the runtime root); the shell: _log_page.html (3 s refresh). #}
{% block title %}webserver logs ({{ src }}) — LoRaHAM Pi Control{% endblock %}
{% block header %}
      <span class="pill">nginx {{ src }}</span>
      <span class="tabs">
        <a href="{{ url_for('webserver_logs', src='error') }}"
           class="pill{{ ' mono' if src == 'error' else '' }}">error log</a>
        <a href="{{ url_for('webserver_logs', src='access') }}"
           class="pill{{ ' mono' if src == 'access' else '' }}">access log</a>
      </span>
{% endblock %}
