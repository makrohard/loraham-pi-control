[[stack.component]]
id = "sideband"
name = "Sideband (GUI)"
kind = "service"
# Sideband reads the position through its gpsd plugin when GPS is on — rns (which declares
# the stack's use_gps switch) reads none itself.
reads_position = true
optional = true
purpose = "Sideband LXMF client with a desktop GUI, attached to the shared instance."
tx_capable = true
depends_on = ["rns"]
# The build COPIES lhpc_location.py out of the driver checkout and runs its
# enable_sideband_plugins.py, so the driver is a real build input. Undeclared, the
# build receipt ignored it: an updated location plugin left Sideband reading "built"
# with the old copy still installed.
build_requires = ["rns-lora-interface"]
start_order = 3
readiness = "process"
build_marker = ".venv/.lhpc-build-complete"
build_timeout = 3600.0
bin = ".venv/bin/sideband"
# Launched through `loraham-rns-client`: pointed at the OWNER's config (which it must
# be — RNS derives the shared-instance RPC key from the identity there) a client
# started while `rns` is absent becomes the shared-instance OWNER and initialises the
# LoRa interface itself, taking the radio. The guard proves the instance exists first.
run = "{runtime}/src/reticulum/.venv/bin/loraham-rns-client --configdir {runtime}/state/reticulum --wait 10 -- .venv/bin/sideband --rnsconfig {runtime}/state/reticulum --config {runtime}/state/sideband"
run_argv = ["{runtime}/src/reticulum/.venv/bin/loraham-rns-client", "--configdir", "{runtime}/state/reticulum", "--wait", "10", "--", ".venv/bin/sideband", "--rnsconfig", "{runtime}/state/reticulum", "--config", "{runtime}/state/sideband"]
run_cwd = "{source}"
note = "Desktop GUI — needs a display, and is far heavier than the node itself (~277 MB resident). On a headless or small box run Sideband on a PHONE OR LAPTOP instead, over the client-access port."
[stack.component.run_env]
DISPLAY = "@env:DISPLAY=:0"
LHPC_LOCATION_CONF = "{runtime}/state/sideband/location.conf"
KIVY_HOME = "{runtime}/state/sideband/kivy"
# Kivy writes its config + logs to ~/.kivy and CREATES that dir on first launch;
# the web console runs ProtectHome=read-only, so a fresh graphical install died at
# startup. KIVY_HOME keeps that state inside the managed runtime root instead.
[stack.component.source]
path = "src/sideband"
remote = "https://github.com/markqvist/Sideband.git"
branch = "main"
pin_commit = "2000d81a44bff57e3b3cb7d45915ba29bbde4e18"
pin_tag = "2000d81"
[stack.component.process]
exec_name = "sideband"
[[stack.component.pre_steps]]
kind = "mkdir"
path = "{runtime}/state/sideband"
[[stack.component.build_steps]]
argv = ["python3", "-m", "venv", "--system-site-packages", ".venv"]
[[stack.component.build_steps]]
# VERSION-PINNED PyPI install, deliberately not `pip install .` from the checkout.
# Sideband's own setup.py looks for `kivymd` beside setup.py while the repo keeps it
# at sbapp/kivymd, so glob_paths(".kv") matches nothing and a source install silently
# drops all 36 Kivy .kv layouts — the app then exits at window creation (verified).
# Reproducing upstream's release build needs their dev layout (sibling Reticulum/LXMF
# symlinks), and patching upstream is out of scope. Pinning the VERSION keeps the
# installed artefact deterministic; it must match the pinned checkout's __version__
# (tests/test_reticulum_stack.py enforces that).
argv = [".venv/bin/pip", "install", "--disable-pip-version-check", "sbapp==1.9.2"]

[[stack.component.build_steps]]
# Idempotence guard: pip treats an already-present 1.9.2 as satisfied and skips it, so a
# venv carrying a BROKEN build of the same version (e.g. an earlier `pip install .`, which
# drops every .kv layout) survives a rebuild untouched and the app dies at window creation.
# --no-deps keeps this to the package itself; the step above resolved the dependency tree.
argv = [".venv/bin/pip", "install", "--disable-pip-version-check", "--force-reinstall", "--no-deps", "sbapp==1.9.2"]

[[stack.component.build_steps]]
argv = ["install", "-d", "-m", "0700", "{runtime}/state/sideband/kivy"]
announce = "[install] Sideband (sbapp) into {source}/.venv — pulls Kivy/numpy/pillow, ~800 MB; progress: watch {source}/.venv/lib grow"
[[stack.component.build_steps]]
argv = ["install", "-D", "-m", "0644", "{runtime}/src/loraham-rns-interface/plugins/lhpc_location.py", "{runtime}/state/sideband/plugins/lhpc_location.py"]
announce = "[install] the location telemetry plugin (Sideband has no GPS backend on Linux)"
[[stack.component.build_steps]]
argv = [".venv/bin/python", "{runtime}/src/loraham-rns-interface/scripts/enable_sideband_plugins.py", "{runtime}/state/sideband", "{runtime}/state/sideband/plugins"]
announce = "[configure] enable Sideband's plugin loader (otherwise only reachable through its GUI settings)"
[stack.component.config_file]
path = "{runtime}/state/sideband/location.conf"
fmt = "env"
# POSITION IS NOT A PER-STACK CHOICE. Every field below is CONTROLLER-OWNED, filled from
# the global `[gps]` setting (`lhpc gps`) and marked `hidden` so it can never be edited per
# stack. Before this, Sideband carried its own independent source selector, which meant two
# stacks could disagree about where position came from — and a stale saved value here would
# silently win over the global setting. The plugin itself stays source-agnostic; it is simply
# handed the resolved answer.
[[stack.component.config_file.param]]
name = "location_source"
key = "location_source"
kind = "str"
default = "{gps_source}"
hidden = true
group = "Position"
label = "Position source (global — set with `lhpc gps`)"
[[stack.component.config_file.param]]
name = "gpsd_host"
key = "gpsd_host"
kind = "str"
default = "{gps_host}"
hidden = true
group = "Position"
label = "gpsd host (global)"
[[stack.component.config_file.param]]
name = "gpsd_port"
key = "gpsd_port"
kind = "str"
default = "{gps_port}"
hidden = true
group = "Position"
label = "gpsd port (global)"
[[stack.component.config_file.param]]
name = "nmea_device"
key = "nmea_device"
kind = "str"
default = "{gps_nmea_device}"
hidden = true
omit_if_empty = true
group = "Position"
label = "NMEA device (global)"
# The direct-NMEA reader configures the port itself, so it needs the baud rate. It was in the
# plugin's own defaults but had no way to be set from lhpc — an operator with a 4800-baud
# receiver had no lever at all.
[[stack.component.config_file.param]]
