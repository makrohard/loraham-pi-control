[[stack.component.config_file.param]]
name = "rns_bind"
key = "listen_ip"
section = "interfaces/Client access"
# enum, NOT str: `choices` is only enforced for enums, so a str param still let the
# CLI, the API or a hand-edited config save a non-loopback address. The node refuses
# one as well — the config is not the only way in.
kind = "enum"
default = "127.0.0.1"
choices = ["127.0.0.1"]
group = "Network exposure"
label = "Client-access bind (loopback only)"
note = "RNS client access on 4242 has NO application-level authentication, so a non-loopback bind would rely entirely on the allow-list plus a managed firewall that may be absent, stale or not live-verified. Locked to loopback for this release; remote clients reach it through an SSH tunnel. Lifting this needs the start path to REFUSE a non-loopback bind unless the firewall is installed, current and live-verified for that exact bind/allow pair."

[[stack.component]]
id = "nomadnet"
name = "NomadNet node"
kind = "service"
optional = true
purpose = "NomadNet browser/TUI and page node on the shared Reticulum instance. Client only — it never owns the radio."
tx_capable = true
interactive = true
depends_on = ["rns"]
start_order = 2
readiness = "manual"
build_marker = ".venv/.lhpc-build-complete"
build_timeout = 900.0
bin = ".venv/bin/nomadnet"
# Launched through `loraham-rns-client`: pointed at the OWNER's config (which it must
# be — RNS derives the shared-instance RPC key from the identity there) a client
# started while `rns` is absent becomes the shared-instance OWNER and initialises the
# LoRa interface itself, taking the radio. The guard proves the instance exists first.
run = "{runtime}/src/reticulum/.venv/bin/loraham-rns-client --configdir {runtime}/state/reticulum --wait 10 -- .venv/bin/nomadnet --rnsconfig {runtime}/state/reticulum --config {runtime}/state/nomadnet"
note = "Interactive ncurses browser (needs a real TTY; no headless mode) — start it yourself with the command lhpc shows, locally or over SSH. It attaches to the Reticulum instance owned by `rns` and never starts its own radio interface; while it is open your node serves its pages and files."
[stack.component.source]
path = "src/nomadnet"
remote = "https://github.com/markqvist/NomadNet.git"
branch = "master"
pin_commit = "ad10301569a39d4f43b3d21ae9fc392602c937ca"
pin_tag = "ad10301"
[stack.component.process]
exec_name = "nomadnet"
[[stack.component.pre_steps]]
kind = "mkdir"
path = "{runtime}/state/nomadnet"
[[stack.component.build_steps]]
argv = ["python3", "-m", "venv", "--system-site-packages", ".venv"]
[[stack.component.build_steps]]
argv = [".venv/bin/pip", "install", "--disable-pip-version-check", "."]
announce = "[install] NomadNet into {source}/.venv — pip is quiet off-TTY"

