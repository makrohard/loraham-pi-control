[[stack.component.resource]]
key = "loraham.radio.868"
kind = "radio-band"
mode = "exclusive"
note = "Owns the radio for this band — conflicts with the daemon and meshtastic on 868."
[[stack.component.resource]]
key = "loraham.radio.433"
kind = "radio-band"
mode = "exclusive"
[[stack.component.resource]]
key = "spi.bus.0"
kind = "spi-bus"
mode = "cooperative"
[[stack.component.resource]]
# Meshtastic drives /dev/spidev0.0 WITHOUT taking spi0.lock, so it cannot be
# interleaved safely with any other bus user. Both it and this node claim this key
# exclusively, which blocks that pair while leaving `daemon + meshtastic` — a
# shipped, field-verified combination whose identical hazard predates this stack and
# is recorded in docs/field-notes.md — untouched.
key = "spi.bus.0.unlocked"
kind = "spi-bus"
mode = "exclusive"
note = "Participates in the daemon's spi0.lock, so both may share the bus."
[[stack.component.resource]]
key = "tcp.port.37428"
kind = "tcp-port"
mode = "exclusive"
[[stack.component.resource]]
key = "tcp.port.37429"
kind = "tcp-port"
mode = "exclusive"
[[stack.component.resource]]
key = "tcp.port.4242"
kind = "tcp-port"
mode = "exclusive"

[[stack.component.require]]
check_file = "/dev/spidev0.0"
install = "printf 'dtparam=spi=on\\ndtoverlay=spi0-0cs\\n' | sudo tee -a /boot/firmware/config.txt"
note = "SPI device. The spi0-0cs overlay (bootstrap-deps.sh --spi-mode soft-cs) is required: the radio's chip-select is driven from userspace, and the kernel must NOT claim CE0/CE1."
[[stack.component.require]]
groups = ["spi", "gpio"]
install = "sudo usermod -aG spi,gpio $USER"
note = "spi + gpio group membership — needed to drive the radio without root"
[[stack.component.require]]
# dpkg RECEIPTS, not dist-packages paths and not `module`. The old check was a
# dist-packages path (Python-version and arch specific) covering gpiod ONLY, so a box
# with gpiod present and spidev missing passed install/doctor and failed later in the
# build's import probe. `module` cannot work here either: it resolves inside the
# CONTROLLER venv, which is built with include-system-site-packages = false and can
# never see an apt binding (verified live — it refused to install on a box where both
# were present). The package receipt is stable across Python and arch.
check_file = "/var/lib/dpkg/info/python3-libgpiod.list"
install = "sudo apt install -y python3-libgpiod python3-spidev"
note = "Python libgpiod binding as a SYSTEM package. The stack venv is built with --system-site-packages and inherits it, so the radio needs no compiler — which is what makes this installable on a Pi Zero, where the pip wheels cannot build."
[[stack.component.require]]
check_file = "/var/lib/dpkg/info/python3-spidev.list"
install = "sudo apt install -y python3-spidev"
note = "Python spidev binding as a SYSTEM package — the other half of the radio's bindings, checked separately so a half-installed pair cannot pass."

