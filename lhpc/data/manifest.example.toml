key = "nmea_baud"
kind = "str"
default = "{gps_baud}"
hidden = true
group = "Position"
label = "NMEA baud (global)"
[[stack.component.config_file.param]]
name = "fixed_lat"
key = "fixed_lat"
kind = "str"
default = "{gps_lat}"
hidden = true
omit_if_empty = true
group = "Position"
label = "Fixed latitude (decimal degrees)"
[[stack.component.config_file.param]]
name = "fixed_lon"
key = "fixed_lon"
kind = "str"
default = "{gps_lon}"
hidden = true
omit_if_empty = true
group = "Position"
label = "Fixed longitude (decimal degrees)"
[[stack.component.config_file.param]]
name = "fixed_alt"
key = "fixed_alt"
kind = "str"
default = "{gps_alt}"
hidden = true
