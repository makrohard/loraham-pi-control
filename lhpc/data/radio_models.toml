[[model]]
id = "waveshare-sx1262"
label = "Waveshare SX1262 LoRa HAT"
short = "wavesh"
transport = "spi"
chip = "sx1262"
bands = ["433", "868"]
power_max_dbm = 20
high_power_switch = false

  [[model.variant]]
  key = "default"
  preset = "waveshare-sx1262"
  pins = { cs = 21, irq = 16, rst = 18, gpio = 20, txen = 6 }

[[model]]
id = "meshstick-1262"
label = "ELECROW Meshstick (SX1262, USB)"
short = "mstick"
transport = "usb-ch341"
chip = "sx1262"
bands = ["868"]
power_max_dbm = 22
high_power_switch = false
usb = { vid = "1a86", pid = "5512" }
direct = { module = "sx1262", spidev = "ch341" }

  [[model.variant]]
  key = "default"
  preset = "meshstick-1262"
  pins = { cs = 0, irq = 6, rst = 2, gpio = 4, rxen = 1 }
