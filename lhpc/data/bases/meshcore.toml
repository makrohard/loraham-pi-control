# MeshCore host configuration — GENERATED BY LHPC, do not edit by hand.
# The MeshCore stack is powered by openHop Core on the LoRaHAM daemon; this file
# feeds `python -m meshcore_host`. Regenerated on every start from the manifest
# params and the global [gps] plan.

[companion]
name = "pyMC"
allow = "127.0.0.1"
port = 5000

[identity]
# LHPC-owned node identity (secret_file injection; the file is 0600).

[radio]
preset = "eu_uk_narrow"
data_socket = "/tmp/lora868f.sock"
config_socket = "/tmp/loraconf868.sock"
enable_tx = true

[persistence]
# db path is rendered by the controller.

[gps]
# Rendered from the global plan: a live source renders `socket`, a fixed source
# renders lat/lon, off renders neither. The host infers the mode from that.

[repeater]
# Which openhop program the host runs (`role`: chat, chat+repeater or repeater). The other keys
# are used only in the repeater roles: the dashboard's login-signing secret, the repeater's own
# state directory (openHop's own config.yaml lives there and holds its name, behaviour, password,
# identity and duty cycle), GPS hand-over, the companion slot lock and LHPC's own restart.
# NOTE for editors of this template: never write `<key> =` in a comment here — the renderer
# updates the FIRST line carrying a declared key, commented or not.
role = "chat"
