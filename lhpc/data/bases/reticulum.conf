# Base for the lhpc-generated Reticulum configuration.
#
# lhpc rewrites the declared keys below from the stack's Config page; anything
# else here is preserved. Do not hand-edit the generated copy in the runtime
# root — it is regenerated on every start.

[reticulum]
  enable_transport = No
  share_instance = Yes
  # TCP shared instance (not the abstract AF_UNIX socket) so the ports are real
  # listeners lhpc can claim exclusively and probe.
  shared_instance_type = tcp
  instance_name = lhpc-reticulum
  shared_instance_port = 37428
  instance_control_port = 37429
  panic_on_interface_error = No

[logging]
  loglevel = 4

[interfaces]

  [[LoRa]]
    type = LoRaSPIInterface
    enabled = yes
    hardware = loraham
    band = 868
    frequency = 868500000
    bandwidth = 125000
    spreadingfactor = 8
    codingrate = 5
    txpower = 14
    airtime_limit_short = 5.0
    airtime_limit_long = 1.0
    # Interface MODES are LHPC's, not settings. INTERNAL, not gateway: measured against the
    # pinned Reticulum 1.5.2, a `gateway` LoRa interface RETRANSMITS onto the radio every
    # announce the node learns from the internet once transport is on (183-byte ANNOUNCE, one
    # hop). RNS filters announces on the OUTGOING interface and its gateway path has no branch
    # that rejects them; `internal` is the branch that does (Transport.py:1455-1510).
    # It costs nothing else — measured in all four directions: our own announces, a
    # shared-instance client's, and announces heard ON the radio still leave the node exactly as
    # before, and with transport OFF the two modes are indistinguishable.
    # The key is `mode`, NOT `interface_mode`: in the `interface_mode` branch of
    # `Reticulum._synthesize_interface` the gateway/internal cases read `c["mode"]`
    # (Reticulum.py:776,778), so `interface_mode = gateway` raises KeyError. Re-check at a bump.
    mode = internal
    spidev = /dev/spidev0.0
    gpio_chip = /dev/gpiochip0
    runtime_dir = /dev/null
    state_dir = /dev/null

  # Attach point for external clients (Sideband, MeshChat). Loopback only: the node refuses a non-loopback bind — remote clients use an SSH tunnel.
  [[Client access]]
    type = TCPServerInterface
    enabled = yes
    # `spawned_interface.mode = self.mode` (TCPInterface.py:639), so every client inherits
    # this: leaving it full would deny Sideband/MeshChat the gateway path discovery the LoRa
    # side gets.
    mode = gateway
    listen_ip = 127.0.0.1
    listen_port = 4242

  # OPTIONAL link to the wider Reticulum network over the internet — a public hub or another
  # node of your own. OFF by default and inert while off: RNS constructs an interface only
  # when `enabled` is true (Reticulum.py:1012), so the empty target below is never read.
  # Enabling this and enabling transport are SEPARATE decisions: this one carries only this
  # node's own traffic.
  # `boundary` and not `gateway`: the announces of a whole internet-side mesh must not be
  # rebroadcast onto a duty-cycle-limited radio. `recursive_prs` goes with LoRa's `internal`:
  # an internal interface is excluded from a boundary interface's default search for unknown
  # paths, so without it an internet-side peer could never discover a destination living on the
  # radio. Measured both ways — without it no path request reaches LoRa, with it exactly one
  # does; requests from the radio outward need nothing extra.
  [[Internet]]
    type = TCPClientInterface
    enabled = no
    mode = boundary
    recursive_prs = yes
    target_host =
    target_port =
