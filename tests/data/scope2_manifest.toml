[[stack]]
id = "ostack2"
name = "Owner Two"
main = "tgt"
[[stack.component]]
id = "tgt"
name = "Target"
kind = "service"
run = "true"
readiness = "process"
depends_on = ["dep"]
  [[stack.component.param]]
  name = "rp"
  kind = "str"
  default = "rp-tgt"
  [[stack.component.param]]
  name = "uniq"
  kind = "str"
  default = "uniq-tgt"
  [stack.component.config_file]
  path = "{runtime}/config/files/tgt.conf"
  fmt = "env"
    [[stack.component.config_file.param]]
    name = "fp"
    key = "FP"
    default = "fp-tgt"
[[stack.component]]
id = "dep"
name = "Dependency"
kind = "service"
run = "true"
readiness = "process"
  [[stack.component.param]]
  name = "rp"
  kind = "str"
  default = "rp-dep"
  [stack.component.config_file]
  path = "{runtime}/config/files/dep.conf"
  fmt = "env"
    [[stack.component.config_file.param]]
    name = "fp"
    key = "FP"
    default = "fp-dep"
[[stack.component]]
id = "sib"
name = "Sibling"
kind = "service"
run = "true"
readiness = "process"
optional = true
  [stack.component.config_file]
  path = "{runtime}/config/files/sib.conf"
  fmt = "env"
    [[stack.component.config_file.param]]
    name = "sp"
    key = "SP"
    default = "sp-sib"
