"meshtastic" = "built from source on the Pi 5 only (docs/test-matrix.md row 9); the Zero runs the binary row 8"
"meshcom-bridge" = "MeshCom from source is built on the Pi 5 only (docs/test-matrix.md row 12); the Zero runs the binary row 11"
"meshcom-qemu" = "MeshCom from source is built on the Pi 5 only (docs/test-matrix.md row 12)"
"meshcom-firmware" = "MeshCom from source is built on the Pi 5 only (docs/test-matrix.md row 12)"
"meshcom-gps-relay" = "MeshCom from source is built on the Pi 5 only (docs/test-matrix.md row 12)"
"loraham-voice" = "GTK-only variant: skipped on the Lite image the Zero runs (docs/test-matrix.md row 3)"
"sideband" = "GTK/Kivy-only: skipped on the Lite image the Zero runs (docs/test-matrix.md row 6)"

