<text x="538" y="455.0" text-anchor="start" font-size="15" fill="#1b2430" font-weight="bold">−</text>
<text x="498" y="461.0" text-anchor="end" font-size="12" fill="#1b2430" font-weight="bold">470 µF</text>
<text x="498" y="476.0" text-anchor="end" font-size="11" fill="#5b6573">≥ 10 V</text>
<line x1="588" y1="468.0" x2="612" y2="468.0" stroke="#1b2430" stroke-width="3"/>
<line x1="588" y1="458.0" x2="612" y2="458.0" stroke="#1b2430" stroke-width="3"/>
<text x="618" y="467.0" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">100 nF</text>
<text x="648" y="522" text-anchor="end" font-size="11" fill="#1b2430" font-weight="bold">at the module: + to pin 5, stripe (−) to GND</text>
<text x="674" y="552" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">9 3.3 V out: leave open</text>
<text x="674" y="582" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">1 ANT → antenna or 50 Ω load</text>
</svg>
