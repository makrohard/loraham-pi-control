<text x="155.0" y="92" text-anchor="middle" font-size="13" fill="#1b2430" font-weight="bold">CH341A BOARD</text>
<rect x="660" y="70" width="280" height="532" rx="6" fill="#f2f4f7" stroke="#1b2430" stroke-width="1.5"/>
<text x="800.0" y="92" text-anchor="middle" font-size="13" fill="#1b2430" font-weight="bold">RFM98PW (module pins)</text>
<text x="54" y="124" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">D0 / CS0</text>
<text x="256" y="124" text-anchor="end" font-size="11" fill="#5b6573">IC 15</text>
<text x="674" y="124" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">13 NSS</text>
