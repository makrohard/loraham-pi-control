<svg xmlns="http://www.w3.org/2000/svg" width="980" height="900" viewBox="0 0 980 900" role="img" aria-labelledby="t d" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13">
<title id="t">Wiring: CH341A board, RFM98PW, capacitors and EEPROM</title>
<desc id="d">Functional wiring. Seven signal wires from the CH341A board to the RFM98PW: W1 D0/CS0 (IC 15) to 13 NSS; W2 D3/SCK (IC 18) to 12 SCK; W3 D5/MOSI (IC 20) to 11 MOSI; W4 D7/MISO (IC 22) from 10 MISO; W5 D2/CS2 (IC 17) to 14 RESET; W6 D6 (IC 21) from 6 DIO0; W7 D4 (IC 19) from 7 DIO1. Board GND (IC 12) to module 2, 16 and pad 17. The USB plug's VBUS (5 V) to module pin 5, with a 470 µF electrolytic (plus to pin 5, stripe to GND) and a 100 nF ceramic across pin 5 and GND at the module. Pin 9 open; pin 1 to the antenna. EEPROM AT24C02N: pins 1, 2, 3, 4 and 7 to GND, 5 SDA to the board's SDA (IC 23), 6 SCL to the board's SCL (IC 24), 8 VCC to the board's 3V3, 100 nF across pins 8 and 4.</desc>
