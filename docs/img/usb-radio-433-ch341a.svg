<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="t d" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13">
<title id="t">CH341A board pads and CH341A pinout</title>
<desc id="d">Left: the CH341A board seen from its underside, USB plug to the right, with the two edge rows of pads as printed (D0 to D7, WR, VCC; SLCT, INT, PEMP, ERR, DS, AS, RST, WAIT, GND, 3V3). The pads this build uses are filled and carry their wire tag: D0 W1, D2 W5, D3 W2, D4 W7, D5 W3, D6 W6, D7 W4, plus GND and 3V3. The pads printed VCC follow the voltage jumpers: 3.3 V here, not 5 V. Right: the CH341A IC, SOP-28, top view, pin 1 at the dot; pins 9 V3, 12 GND, 15 to 22 D0 to D7, 23 SDA, 24 SCL and 28 VCC are labelled.</desc>
