<text x="492" y="130" text-anchor="start" font-size="11" fill="#1b2430" font-weight="bold">not the radio's 5 V</text>
<text x="40" y="432" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">Use D2 / CS2 for RESET (W5), not the pad marked RST.</text>
<text x="40" y="452" text-anchor="start" font-size="12" fill="#5b6573">Filled = used by this build. Tags W1–W7 are this guide's labels, not board marks.</text>
<text x="40" y="472" text-anchor="start" font-size="12" fill="#5b6573">Check each pad against the IC pin on the right by continuity.</text>
