<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" role="img" aria-labelledby="t d" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13">
<title id="t">RFM98PW module pinout, top view</title>
<desc id="d">The RFM98PW module seen from its shield side, as in HopeRF's drawing: pins 9 to 16 down the left edge, pins 8 to 1 down the right edge, pin 1 at the bottom right next to the round mark. Used: 13 NSS W1, 12 SCK W2, 11 MOSI W3, 10 MISO W4, 14 RESET W5, 6 DIO0 W6, 7 DIO1 W7, 5 VCC 5 to 6 V, 2 and 16 GND, 1 ANT. Pin 9 is a 3.3 V output and stays open. Pad 17 on the underside is ground.</desc>
<rect x="0.5" y="0.5" width="919" height="449" rx="12" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/>
<text x="460" y="40" text-anchor="middle" font-size="14" fill="#1b2430" font-weight="bold">RFM98PW MODULE: TOP VIEW (shield side), module pin numbers</text>
<rect x="330" y="70" width="260" height="280" rx="4" fill="#f2f4f7" stroke="#1b2430" stroke-width="1.5"/>
<rect x="356" y="84" width="208" height="252" rx="3" fill="#ffffff" stroke="#5b6573" stroke-width="1"/>
<text x="460.0" y="204.0" text-anchor="middle" font-size="16" fill="#1b2430" font-weight="bold">RFM98PW</text>
<text x="460.0" y="224.0" text-anchor="middle" font-size="12" fill="#5b6573">shield side</text>
<rect x="316" y="92" width="12" height="12" rx="0" fill="#ffffff" stroke="#1b2430" stroke-width="1.5"/>
<line x1="316" y1="104" x2="328" y2="92" stroke="#1b2430" stroke-width="1.5"/>
<line x1="316" y1="92" x2="328" y2="104" stroke="#1b2430" stroke-width="1.5"/>
<text x="338" y="102" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">9</text>
<text x="308" y="102" text-anchor="end" font-size="13" fill="#1b2430" font-weight="bold">3.3 V OUTPUT: leave open</text>
<rect x="592.0" y="92.0" width="12" height="12" rx="0" fill="#ffffff" stroke="#5b6573" stroke-width="1.5"/>
<text x="582" y="102" text-anchor="end" font-size="12" fill="#5b6573">8</text>
<text x="612" y="102" text-anchor="start" font-size="13" fill="#5b6573">DIO2 (unused)</text>
<rect x="316.0" y="124.0" width="12" height="12" rx="0" fill="#1b2430" stroke="#1b2430" stroke-width="1.5"/>
<text x="338" y="134" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">10</text>
<text x="308" y="134" text-anchor="end" font-size="13" fill="#1b2430" font-weight="bold">MISO · W4</text>
<rect x="592.0" y="124.0" width="12" height="12" rx="0" fill="#1b2430" stroke="#1b2430" stroke-width="1.5"/>
<text x="582" y="134" text-anchor="end" font-size="12" fill="#1b2430" font-weight="bold">7</text>
<text x="612" y="134" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">DIO1 · W7</text>
<rect x="316.0" y="156.0" width="12" height="12" rx="0" fill="#1b2430" stroke="#1b2430" stroke-width="1.5"/>
<text x="338" y="166" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">11</text>
<text x="308" y="166" text-anchor="end" font-size="13" fill="#1b2430" font-weight="bold">MOSI · W3</text>
<rect x="592.0" y="156.0" width="12" height="12" rx="0" fill="#1b2430" stroke="#1b2430" stroke-width="1.5"/>
<text x="582" y="166" text-anchor="end" font-size="12" fill="#1b2430" font-weight="bold">6</text>
<text x="612" y="166" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">DIO0 · W6</text>
<rect x="316.0" y="188.0" width="12" height="12" rx="0" fill="#1b2430" stroke="#1b2430" stroke-width="1.5"/>
<text x="338" y="198" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">12</text>
<text x="308" y="198" text-anchor="end" font-size="13" fill="#1b2430" font-weight="bold">SCK · W2</text>
<rect x="592.0" y="188.0" width="12" height="12" rx="0" fill="#1b2430" stroke="#1b2430" stroke-width="1.5"/>
<text x="582" y="198" text-anchor="end" font-size="12" fill="#1b2430" font-weight="bold">5</text>
<text x="612" y="198" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">VCC 5–6 V (+ 470 µF, 100 nF)</text>
<rect x="316.0" y="220.0" width="12" height="12" rx="0" fill="#1b2430" stroke="#1b2430" stroke-width="1.5"/>
<text x="338" y="230" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">13</text>
<text x="308" y="230" text-anchor="end" font-size="13" fill="#1b2430" font-weight="bold">NSS · W1</text>
<rect x="592.0" y="220.0" width="12" height="12" rx="0" fill="#ffffff" stroke="#5b6573" stroke-width="1.5"/>
<text x="582" y="230" text-anchor="end" font-size="12" fill="#5b6573">4</text>
<text x="612" y="230" text-anchor="start" font-size="13" fill="#5b6573">DIO4 (unused)</text>
<rect x="316.0" y="252.0" width="12" height="12" rx="0" fill="#1b2430" stroke="#1b2430" stroke-width="1.5"/>
<text x="338" y="262" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">14</text>
<text x="308" y="262" text-anchor="end" font-size="13" fill="#1b2430" font-weight="bold">RESET · W5</text>
<rect x="592.0" y="252.0" width="12" height="12" rx="0" fill="#ffffff" stroke="#5b6573" stroke-width="1.5"/>
<text x="582" y="262" text-anchor="end" font-size="12" fill="#5b6573">3</text>
<text x="612" y="262" text-anchor="start" font-size="13" fill="#5b6573">DIO3 (unused)</text>
<rect x="316.0" y="284.0" width="12" height="12" rx="0" fill="#ffffff" stroke="#5b6573" stroke-width="1.5"/>
<text x="338" y="294" text-anchor="start" font-size="12" fill="#5b6573">15</text>
<text x="308" y="294" text-anchor="end" font-size="13" fill="#5b6573">DIO5 (unused)</text>
<rect x="592.0" y="284.0" width="12" height="12" rx="0" fill="#1b2430" stroke="#1b2430" stroke-width="1.5"/>
<text x="582" y="294" text-anchor="end" font-size="12" fill="#1b2430" font-weight="bold">2</text>
<text x="612" y="294" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">GND</text>
<rect x="316.0" y="316.0" width="12" height="12" rx="0" fill="#1b2430" stroke="#1b2430" stroke-width="1.5"/>
<text x="338" y="326" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">16</text>
<text x="308" y="326" text-anchor="end" font-size="13" fill="#1b2430" font-weight="bold">GND</text>
<rect x="592.0" y="316.0" width="12" height="12" rx="0" fill="#1b2430" stroke="#1b2430" stroke-width="1.5"/>
<text x="582" y="326" text-anchor="end" font-size="12" fill="#1b2430" font-weight="bold">1</text>
<text x="612" y="326" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">ANT: antenna or 50 Ω load</text>
<circle cx="550" cy="320" r="6" fill="#ffffff" stroke="#1b2430" stroke-width="1.5"/>
<text x="538" y="324" text-anchor="end" font-size="11" fill="#5b6573">pin 1 mark</text>
<rect x="60" y="380" width="150" height="44" rx="4" fill="#f2f4f7" stroke="#1b2430" stroke-width="1.5"/>
<text x="135" y="407" text-anchor="middle" font-size="13" fill="#1b2430" font-weight="bold">17  GND</text>
<text x="226" y="398" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">Pad 17 is on the UNDERSIDE (thermal pad): solder it to grounded copper.</text>
<text x="226" y="418" text-anchor="start" font-size="12" fill="#5b6573">Filled = connect; hollow = leave open; crossed = must stay open. Pin numbers are the module's, not the chip's.</text>
</svg>
