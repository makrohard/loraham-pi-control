<svg xmlns="http://www.w3.org/2000/svg" width="980" height="868" viewBox="0 0 980 868" role="img" aria-labelledby="t d" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13">
<title id="t">Wiring: CH341A board and an SX1262 module</title>
<desc id="d">Functional wiring of an 868 MHz SX1262 module as the model meshstick-1262: D0 to NSS, D3 to SCK, D5 to MOSI, MISO to D7, D2 to NRST, DIO1 to D6, BUSY to D4, D1 to RXEN, GND to every GND pin. On a module with a TXEN pin, TXEN is tied to DIO2 at the module. The module needs a TCXO powered from DIO3 at 1.8 V. VCC 3.3 V from a separate supply, grounds joined, 100 nF and 10 µF at the module.</desc>
<defs>
<marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fae"/></marker>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85400"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#237a3b"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00707a"/></marker>
<marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker>
<marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8245a"/></marker>
<marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4a2e"/></marker>
<marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d6e8f"/></marker>
</defs>
<rect x="0.5" y="0.5" width="979" height="867" rx="12" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/>
<text x="490" y="36" text-anchor="middle" font-size="14" fill="#1b2430" font-weight="bold">SX1262 MODULE, 868 MHz, wired as the Meshstick: model meshstick-1262 (functional drawing)</text>
<rect x="40" y="70" width="230" height="578" rx="6" fill="#f2f4f7" stroke="#1b2430" stroke-width="1.5"/>
<text x="155" y="92" text-anchor="middle" font-size="13" fill="#1b2430" font-weight="bold">CH341A BOARD</text>
<rect x="660" y="70" width="280" height="578" rx="6" fill="#f2f4f7" stroke="#1b2430" stroke-width="1.5"/>
<text x="800" y="92" text-anchor="middle" font-size="13" fill="#1b2430" font-weight="bold">SX1262 MODULE (signal names)</text>
<text x="54" y="124" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">D0 / CS0</text>
<text x="256" y="124" text-anchor="end" font-size="11" fill="#5b6573">IC 15</text>
<text x="674" y="124" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">NSS</text>
<line x1="276" y1="120" x2="654" y2="120" stroke="#1f5fae" stroke-width="2.2" marker-end="url(#a0)"/>
<circle cx="270" cy="120" r="4" fill="#1f5fae"/><circle cx="660" cy="120" r="4" fill="#1f5fae"/>
<text x="54" y="168" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">D3 / SCK</text>
<text x="256" y="168" text-anchor="end" font-size="11" fill="#5b6573">IC 18</text>
<text x="674" y="168" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">SCK</text>
<line x1="276" y1="164" x2="654" y2="164" stroke="#a85400" stroke-width="2.2" marker-end="url(#a1)"/>
<circle cx="270" cy="164" r="4" fill="#a85400"/><circle cx="660" cy="164" r="4" fill="#a85400"/>
<text x="54" y="212" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">D5 / MOSI</text>
<text x="256" y="212" text-anchor="end" font-size="11" fill="#5b6573">IC 20</text>
<text x="674" y="212" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">MOSI</text>
<line x1="276" y1="208" x2="654" y2="208" stroke="#237a3b" stroke-width="2.2" marker-end="url(#a2)"/>
<circle cx="270" cy="208" r="4" fill="#237a3b"/><circle cx="660" cy="208" r="4" fill="#237a3b"/>
<text x="54" y="256" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">D7 / MISO</text>
<text x="256" y="256" text-anchor="end" font-size="11" fill="#5b6573">IC 22</text>
<text x="674" y="256" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">MISO</text>
<line x1="276" y1="252" x2="654" y2="252" stroke="#00707a" stroke-width="2.2" marker-start="url(#a3)"/>
<circle cx="270" cy="252" r="4" fill="#00707a"/><circle cx="660" cy="252" r="4" fill="#00707a"/>
<text x="54" y="300" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">D2 / CS2</text>
<text x="256" y="300" text-anchor="end" font-size="11" fill="#5b6573">IC 17</text>
<text x="674" y="300" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">NRST (reset)</text>
<line x1="276" y1="296" x2="654" y2="296" stroke="#6b4fa0" stroke-width="2.2" marker-end="url(#a4)"/>
<circle cx="270" cy="296" r="4" fill="#6b4fa0"/><circle cx="660" cy="296" r="4" fill="#6b4fa0"/>
<text x="54" y="344" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">D6</text>
<text x="256" y="344" text-anchor="end" font-size="11" fill="#5b6573">IC 21</text>
<text x="674" y="344" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">DIO1 (interrupt)</text>
<line x1="276" y1="340" x2="654" y2="340" stroke="#a8245a" stroke-width="2.2" marker-start="url(#a5)"/>
<circle cx="270" cy="340" r="4" fill="#a8245a"/><circle cx="660" cy="340" r="4" fill="#a8245a"/>
<text x="54" y="388" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">D4</text>
<text x="256" y="388" text-anchor="end" font-size="11" fill="#5b6573">IC 19</text>
<text x="674" y="388" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">BUSY</text>
<line x1="276" y1="384" x2="654" y2="384" stroke="#6b4a2e" stroke-width="2.2" marker-start="url(#a6)"/>
<circle cx="270" cy="384" r="4" fill="#6b4a2e"/><circle cx="660" cy="384" r="4" fill="#6b4a2e"/>
<text x="54" y="432" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">D1 / CS1</text>
<text x="256" y="432" text-anchor="end" font-size="11" fill="#5b6573">IC 16</text>
<text x="674" y="432" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">RXEN</text>
<line x1="276" y1="428" x2="654" y2="428" stroke="#3d6e8f" stroke-width="2.2" marker-end="url(#a7)"/>
<circle cx="270" cy="428" r="4" fill="#3d6e8f"/><circle cx="660" cy="428" r="4" fill="#3d6e8f"/>
<text x="54" y="476" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">GND</text>
<text x="256" y="476" text-anchor="end" font-size="11" fill="#5b6573">IC 12</text>
<line x1="270" y1="472" x2="660" y2="472" stroke="#1b2430" stroke-width="2.2"/>
<circle cx="270" cy="472" r="4" fill="#1b2430"/><circle cx="660" cy="472" r="4" fill="#1b2430"/>
<text x="674" y="476" text-anchor="start" font-size="13" fill="#1b2430" font-weight="bold">every GND pin</text>
<rect x="300" y="518" width="200" height="48" rx="5" fill="#ffffff" stroke="#c0261f" stroke-width="1.8"/>
<text x="400" y="538" text-anchor="middle" font-size="12" fill="#c0261f" font-weight="bold">3.3 V SUPPLY</text>
<text x="400" y="555" text-anchor="middle" font-size="11" fill="#5b6573">grounds joined</text>
<line x1="500" y1="542" x2="660" y2="542" stroke="#c0261f" stroke-width="2.2"/>
<circle cx="660" cy="542" r="4" fill="#c0261f"/>
<line x1="400" y1="518" x2="400" y2="472" stroke="#1b2430" stroke-width="1.6" stroke-dasharray="4 3"/>
<circle cx="400" cy="472" r="3.5" fill="#1b2430"/>
<text x="674" y="546" text-anchor="start" font-size="13" fill="#c0261f" font-weight="bold">VCC 3.3 V</text>
<line x1="590" y1="472" x2="590" y2="512" stroke="#1b2430" stroke-width="1.5"/>
<line x1="578" y1="512" x2="602" y2="512" stroke="#1b2430" stroke-width="2.4"/>
<line x1="578" y1="520" x2="602" y2="520" stroke="#1b2430" stroke-width="2.4"/>
<line x1="590" y1="520" x2="590" y2="542" stroke="#1b2430" stroke-width="1.5"/>
<circle cx="590" cy="542" r="3.5" fill="#c0261f"/><circle cx="590" cy="472" r="3.5" fill="#1b2430"/>
<text x="572" y="510" text-anchor="end" font-size="11" fill="#1b2430" font-weight="bold">100 nF + 10 µF</text>
<text x="674" y="576" text-anchor="start" font-size="12" fill="#5b6573" font-weight="bold">TXEN (if present) ── DIO2</text>
<text x="674" y="598" text-anchor="start" font-size="12" fill="#5b6573" font-weight="bold">DIO3: the module's TCXO</text>
<text x="674" y="620" text-anchor="start" font-size="12" fill="#5b6573" font-weight="bold">ANT: antenna / 50 Ω</text>
<text x="40" y="684" text-anchor="start" font-size="12" fill="#c0261f" font-weight="bold">The 3.3 V supply: rated for the module's TX current (its datasheet).</text>
<text x="40" y="706" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">The preset fixes: a TCXO powered from DIO3 at 1.8 V, DIO2 as the RF switch's TX control, RXEN on D1,</text>
<text x="40" y="728" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">up to +22 dBm, 868 MHz. The module must match all of them.</text>
<text x="40" y="750" text-anchor="start" font-size="12" fill="#5b6573">A module with TXEN and RXEN pins (e.g. EBYTE E22-900M22S): tie TXEN to DIO2 at the module, RXEN to D1.</text>
<text x="40" y="772" text-anchor="start" font-size="12" fill="#5b6573">A module with a plain crystal (no TCXO) does not match this preset: wire it as the PINE64 adapter</text>
<text x="40" y="794" text-anchor="start" font-size="12" fill="#5b6573">(DIO1 on INT#, BUSY on SLCT, no reset; model pinedio-usb-1262).</text>
<text x="40" y="816" text-anchor="start" font-size="12" fill="#5b6573">DIO3 stays on the module's TCXO; ANT: an 868 MHz antenna or a 50 Ω load before any transmission.</text>
</svg>
