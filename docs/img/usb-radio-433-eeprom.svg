<line x1="250" y1="842" x2="270" y2="842" stroke="#1b2430" stroke-width="1.5"/>
<line x1="254" y1="846" x2="266" y2="846" stroke="#1b2430" stroke-width="1.5"/>
<line x1="258" y1="850" x2="262" y2="850" stroke="#1b2430" stroke-width="1.5"/>
<text x="250" y="706" text-anchor="end" font-size="12" fill="#1b2430" font-weight="bold">GND</text>
