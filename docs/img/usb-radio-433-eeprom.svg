<text x="472" y="706" text-anchor="end" font-size="12" fill="#1b2430" font-weight="bold">VCC 8</text>
<line x1="314" y1="736" x2="330" y2="736" stroke="#1b2430" stroke-width="2"/>
<text x="338" y="740" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">2 A1</text>
<line x1="260" y1="736" x2="314" y2="736" stroke="#1b2430" stroke-width="2"/>
<circle cx="260" cy="736" r="3.5" fill="#1b2430" stroke="none" stroke-width="1"/>
<line x1="480" y1="736" x2="496" y2="736" stroke="#1b2430" stroke-width="2"/>
<text x="472" y="740" text-anchor="end" font-size="12" fill="#1b2430" font-weight="bold">WP 7</text>
