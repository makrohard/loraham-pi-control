<line x1="530" y1="748" x2="542" y2="748" stroke="#1b2430" stroke-width="1.5"/>
<line x1="534" y1="752" x2="538" y2="752" stroke="#1b2430" stroke-width="1.5"/>
<text x="550" y="756" text-anchor="start" font-size="11" fill="#5b6573">WP to GND: write enabled</text>
