<circle cx="260" cy="770" r="3.5" fill="#1b2430" stroke="none" stroke-width="1"/>
<line x1="480" y1="770" x2="496" y2="770" stroke="#1b2430" stroke-width="2"/>
<text x="472" y="774" text-anchor="end" font-size="12" fill="#1b2430" font-weight="bold">SCL 6</text>
<line x1="314" y1="804" x2="330" y2="804" stroke="#1b2430" stroke-width="2"/>
<text x="338" y="808" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">4 GND</text>
<line x1="260" y1="804" x2="314" y2="804" stroke="#1b2430" stroke-width="2"/>
<circle cx="260" cy="804" r="3.5" fill="#1b2430" stroke="none" stroke-width="1"/>
<line x1="480" y1="804" x2="496" y2="804" stroke="#1b2430" stroke-width="2"/>
