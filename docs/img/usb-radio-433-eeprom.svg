<text x="876" y="808" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">board SDA</text>
<text x="876" y="823" text-anchor="start" font-size="11" fill="#5b6573">(IC 23)</text>
<circle cx="740" cy="702" r="3.5" fill="#1b2430" stroke="none" stroke-width="1"/>
<line x1="740" y1="702" x2="740" y2="716" stroke="#1b2430" stroke-width="2"/>
<line x1="728" y1="716" x2="752" y2="716" stroke="#1b2430" stroke-width="3"/>
<line x1="728" y1="726" x2="752" y2="726" stroke="#1b2430" stroke-width="3"/>
<line x1="740" y1="726" x2="740" y2="734" stroke="#1b2430" stroke-width="2"/>
<line x1="740" y1="734" x2="740" y2="742" stroke="#1b2430" stroke-width="1.5"/>
<line x1="730" y1="742" x2="750" y2="742" stroke="#1b2430" stroke-width="1.5"/>
<line x1="734" y1="746" x2="746" y2="746" stroke="#1b2430" stroke-width="1.5"/>
<line x1="738" y1="750" x2="742" y2="750" stroke="#1b2430" stroke-width="1.5"/>
<text x="758" y="726" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">100 nF across</text>
<text x="758" y="741" text-anchor="start" font-size="11" fill="#5b6573">pins 8 and 4</text>
<text x="40" y="874" text-anchor="start" font-size="12" fill="#5b6573">SDA and SCL are the board's I2C pins, not D5 or D6.</text>
</svg>
