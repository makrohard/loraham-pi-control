<svg xmlns="http://www.w3.org/2000/svg" width="980" height="285" viewBox="0 615 980 285" role="img" aria-labelledby="t d" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13">
<title id="t">Wiring: the AT24C02N EEPROM on the CH341A board</title>
<desc id="d">EEPROM AT24C02N, SOIC-8, top view: pins 1, 2, 3, 4 and 7 to GND (I2C address 0x50, write enabled), 5 SDA to the board's SDA (IC 23), 6 SCL to the board's SCL (IC 24), 8 VCC to the board's 3V3, 100 nF across pins 8 and 4.</desc>
<rect x="0.5" y="615.5" width="979" height="284" rx="12" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/>
<text x="40" y="648" text-anchor="start" font-size="14" fill="#1b2430" font-weight="bold">EEPROM AT24C02N (SOIC-8, TOP VIEW, pin 1 at the dot)</text>
<rect x="330" y="674" width="150" height="172" rx="4" fill="#f2f4f7" stroke="#1b2430" stroke-width="1.5"/>
<circle cx="344" cy="688" r="4.5" fill="#1b2430" stroke="none" stroke-width="1"/>
<text x="405.0" y="836" text-anchor="middle" font-size="13" fill="#1b2430" font-weight="bold">AT24C02N</text>
<line x1="314" y1="702" x2="330" y2="702" stroke="#1b2430" stroke-width="2"/>
<text x="338" y="706" text-anchor="start" font-size="12" fill="#1b2430" font-weight="bold">1 A0</text>
<line x1="260" y1="702" x2="314" y2="702" stroke="#1b2430" stroke-width="2"/>
