name: CI

# Release gate: runs on pushes to main and on pull requests. Fails closed — no step is
# allowed to be skipped or weakened to obtain a green result.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:        # a release branch is checked by dispatching on its ref

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs for the same ref so only the latest matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is Raspberry Pi OS Trixie's interpreter (the deployment target); 3.11 retained for
        # Bookworm compatibility. 3.12 kept as the in-between.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Third-party actions are pinned to immutable commit SHAs (never floating tags).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # FULL history and tags. `tests/repo/test_artifact_portability.py` compares what this
          # controller adds to an artifact against the publish roots RELEASED controllers
          # declare, which it reads out of their tags — on a shallow checkout it found none and
          # skipped, so the guard sat in a required job proving nothing. It now FAILS in CI
          # rather than skipping, and this is what keeps it able to run.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and audit tooling
        # Lint/test tooling comes from pyproject's [dev] extra — the SAME versions a local
        # `pip install .[dev]` gets. Those versions FLOAT on purpose; what stops a new release
        # from turning main red with zero code changes is the frozen CONFIG, not a frozen tool:
        # ruff's rule set is enumerated in [tool.ruff.lint] select (after 0.16.0 changed its
        # default selection, 2026-07-24) and bandit runs high-severity-only. pip-audit floats
        # too — its value is the freshest vulnerability database.
        run: |
          . "$GITHUB_WORKSPACE/.github/scripts/retry.sh"
          retry 3 python -m pip install --upgrade pip
          retry 3 pip install .[dev] pip-audit

      - name: Byte-compile production code
        run: python -m compileall -q lhpc

      - name: Shell-syntax check installer + bootstrap scripts
        run: bash -n install.sh uninstall.sh bootstrap-deps.sh

      - name: Ruff (production code + test lab, frozen ruleset)
        # `testlab` too: CONTRIBUTING has always named it in this gate, but CI checked only
        # `lhpc`, so five findings sat on `main` unnoticed until someone ran it by hand.
        run: ruff check lhpc testlab

      - name: Ruff (tests — fatal errors only)
        run: ruff check tests --select F,E9

      - name: Tests (with branch coverage)
        # `-rs` NAMES every skip. A skip is a test that did not run, and the count alone hides
        # which: this runner skips one more than the Pi does, and nothing in the log said which
        # or why. Cheap to print, and it turns a silent coverage hole into a visible line.
        # Coverage is MEASURED and published (terminal summary, XML artifact, job summary), not
        # gated: no --cov-fail-under on purpose — a drop is judged in review, not by a threshold.
        # `python -m pytest`, NOT the console script: the package is installed non-editable
        # above, and the console script leaves the checkout OFF sys.path, so the tests import
        # site-packages while `--cov=lhpc` resolves to the checkout. Coverage then watches files
        # nobody executes and reports ~0% however many tests pass. `-m` puts the working directory
        # first, so the imported and the measured tree are the same one. The install above still
        # proves the package builds and installs.
        run: python -m pytest -q -rs --cov=lhpc --cov-branch --cov-report=term:skip-covered --cov-report=xml:coverage.xml

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          r = ET.parse("coverage.xml").getroot()
          line = f"Branch-inclusive coverage: lines {float(r.get('line-rate'))*100:.1f} %, branches {float(r.get('branch-rate'))*100:.1f} %"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"### {line}\n")
          PY

      - name: Upload coverage.xml
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30

      # The two SECURITY gates run even when the tests failed. They are the only steps ordered
      # AFTER pytest, so a single test failure used to skip them entirely and a run could go red
      # without ever reporting whether a high-severity finding or a vulnerable dependency had been
      # introduced. `!cancelled()` (not `always()`) keeps a cancelled run cancellable; the job still
      # fails overall on the pytest failure.
      - name: Bandit (high severity gate)
        if: ${{ !cancelled() }}
        run: bandit -q -r lhpc -lll

      # DELIBERATELY NOT RETRIED: pip-audit exits 1 when it finds a real vulnerability, so a
      # generic retry cannot tell a security verdict from a transport fault. This is a fail-closed
      # security gate and stays one.
      - name: pip-audit (dependency vulnerabilities)
        if: ${{ !cancelled() }}
        run: pip-audit . --strict --progress-spinner=off

  # Authoritative CROSS-REPOSITORY pin gate. Catches BOTH orphaned-pin classes: a pin that predates a
  # referenced script, AND a once-valid SHA orphaned by force-pushing/amending the source branch (no
  # longer an ancestor of the remote branch tip). Read-only, immutable action SHAs, no persisted creds.
  pin-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate EVERY pinned source against its live branch
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.github/scripts/retry.sh"
          # The validated set is DERIVED from the manifest: a newly pinned repo is covered the
          # moment it is added. (This job used to hardcode src/meshcom-qemu-raspi, so ten other
          # pinned repos could orphan their pin unnoticed.)
          paths=$(python tools/manifest_pin.py --list)
          test -n "$paths" || { echo "::error::no pinned sources found"; exit 1; }
          validated=0
          scripts_validated=0
          for path in $paths; do
            eval "$(python tools/manifest_pin.py --shell "$path")"
            test -n "${PIN:-}" && test -n "${REMOTE:-}" && test -n "${BRANCH:-}"
            echo "--- $path: ${CONSUMERS} consumer(s), PIN=${PIN} on ${REMOTE} (${BRANCH})"
            dir="ext/$(basename "$path")"
            rm -rf "$dir"; mkdir -p "$dir"
            git init -q "$dir"
            git -C "$dir" remote add origin "$REMOTE"
            # FULL fetch of the source branch. An ORPHANED pin (force-push/amend) is not reachable,
            # so the object resolution below HARD-FAILS — exactly the 56dc877 -> amend signature.
            # Acquisition only. A dropped connection to one of seventeen remotes is not a
            # statement about the pin; the checks BELOW are, and none of them is retried.
            retry 3 git -C "$dir" fetch --no-tags origin "$BRANCH"
            git -C "$dir" cat-file -e "${PIN}^{commit}" \
              || { echo "::error::$path: pinned commit ${PIN} not found on ${BRANCH} (orphaned pin?)"; exit 1; }
            git -C "$dir" merge-base --is-ancestor "$PIN" "origin/${BRANCH}" \
              || { echo "::error::$path: pinned commit ${PIN} is not an ancestor of origin/${BRANCH}"; exit 1; }
            git -C "$dir" checkout -q "$PIN"
            # Referenced scripts are an ADDITIONAL layer — a pinned repo that references none is
            # still fully validated above (pin resolves + is an ancestor).
            for s in ${SCRIPTS:-}; do
              test -f "$dir/$s" || { echo "::error::$path: referenced script missing at ${PIN}: $s"; exit 1; }
              case "$s" in *.sh) bash -n "$dir/$s" ;; esac
              scripts_validated=$((scripts_validated + 1))
            done
            # Repo-specific contracts (managed PIO + runtime-owned PLATFORMIO_CORE_DIR, and the
            # external fetch-qemu tests) apply only to the QEMU source.
            if [ "$path" = "src/meshcom-qemu-raspi" ]; then
              grep -qF 'PIO="${PIO:-pio}"' "$dir/scripts/build.sh"
              grep -qF 'PIO="${PIO:-pio}"' "$dir/scripts/prepare-openeth.sh"
              grep -qF 'PLATFORMIO_CORE_DIR' "$dir/scripts/build.sh"
              bash "$dir/tests/test-fetch-qemu.sh"
            fi
            validated=$((validated + 1))
          done
          test "$validated" -gt 0 || { echo "::error::zero pinned sources validated"; exit 1; }
          test "$scripts_validated" -gt 0 || { echo "::error::zero referenced scripts validated"; exit 1; }
          echo "pin validation OK — ${validated} pinned source(s), ${scripts_validated} script(s)"

  meshcore-host:
    # LHPC's OWN tests for `lhpc/data/meshcore_host` — the adapter implementing openHop's
    # LoRaRadio contract on the LoRaHAM daemon's sockets, plus LHPC's identity, persistence and
    # GPS-feed glue. They ship inside lhpc/data/, so `pytest -q` (testpaths = tests) never
    # collects them. Most of them exercise LHPC behaviour AGAINST the external API, so the
    # PINNED openHop core is installed here as a DEPENDENCY, patched exactly as a box builds it.
    #
    # What this job does NOT do: run openHop's or MeshCore's own upstream test suites. Those are
    # the operator's diagnostic, exposed on the box through the meshcore stack's host test
    # (`lhpc test meshcore`), and an upstream failure there is information, never a red LHPC gate.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the pinned openHop core (pristine, as a box builds it)
        run: |
          set -euo pipefail
          # The pin comes from the manifest, never from a literal here: this job can never test
          # against a different commit than the one the product installs.
          eval "$(python - <<'PY'
          import tomllib, pathlib, shlex
          m = tomllib.loads(pathlib.Path("lhpc/data/manifest.example.toml").read_text())
          for s in m["stack"]:
              for c in s.get("component", []):
                  if c["id"] == "meshcore-node":
                      src = c["source"]
                      print(f"REMOTE={shlex.quote(src['remote'])}")
                      print(f"PIN={shlex.quote(src['pin_commit'])}")
          PY
          )"
          test -n "${PIN:-}" || { echo "::error::no meshcore-node pin in the manifest"; exit 1; }
          git clone -q "$REMOTE" /tmp/openhop-core
          git -C /tmp/openhop-core checkout -q "$PIN"
          # No patch is applied: LHPC builds openhop_core pristine. This job exists to prove the
          # meshcore_host adapter against the upstream the product actually installs, so it must
          # install exactly that — an unmodified checkout at the manifest pin.
          . "$GITHUB_WORKSPACE/.github/scripts/retry.sh"
          retry 3 python -m pip install -q --upgrade pip
          retry 3 python -m pip install -q /tmp/openhop-core meshcore pytest pytest-asyncio
          retry 3 python -m pip install -q --no-deps ./lhpc/data/meshcore_host
      - name: LHPC MeshCore host tests
        run: pytest -q -rs lhpc/data/meshcore_host/tests
      - name: MeshCore RF-log decoder (openHop's own crypto, generated keys)
        run: pytest -q -rs lhpc/data/rfdecode/tests/test_meshcore_decoder.py

  rfdecode-meshtastic:
    # The meshtastic RF-log decoder runs under the managed Meshtastic CLI venv on a box; here it
    # runs under the same pinned `meshtastic` package (the version is read from the manifest,
    # never a literal). Keys in the tests are the public default PSK and generated ones.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the pinned Meshtastic CLI
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.github/scripts/retry.sh"
          ver=$(grep -oE 'meshtastic==[0-9.]+' lhpc/data/manifest.example.toml | head -1)
          test -n "$ver" || { echo "::error::no meshtastic== pin in the manifest"; exit 1; }
          retry 3 python -m pip install -q --upgrade pip
          retry 3 python -m pip install -q "$ver" pycryptodomex==3.23.0 pytest
      - name: Meshtastic RF-log decoder tests
        run: pytest -q -rs lhpc/data/rfdecode/tests/test_meshtastic_decoder.py

  rfdecode-reticulum:
    # The reticulum RF-log decoder runs under src/reticulum/.venv on a box; here under the same
    # pinned Reticulum checkout (pin from the manifest) plus LXMF for the message summary.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the pinned Reticulum and LXMF
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.github/scripts/retry.sh"
          eval "$(python - <<'PY'
          import tomllib, pathlib, shlex
          m = tomllib.loads(pathlib.Path("lhpc/data/manifest.example.toml").read_text())
          for s in m["stack"]:
              for c in s.get("component", []):
                  src = c.get("source") or {}
                  if src.get("path") == "src/reticulum":
                      print(f"RNS_REMOTE={shlex.quote(src['remote'])}; RNS_PIN={shlex.quote(src['pin_commit'])}")
                  if src.get("path") == "src/lxmf":
                      print(f"LXMF_REMOTE={shlex.quote(src['remote'])}; LXMF_PIN={shlex.quote(src['pin_commit'])}")
          PY
          )"
          test -n "${RNS_PIN:-}" && test -n "${LXMF_PIN:-}" || { echo "::error::reticulum/lxmf pins missing"; exit 1; }
          git clone -q "$RNS_REMOTE" /tmp/rns && git -C /tmp/rns checkout -q "$RNS_PIN"
          git clone -q "$LXMF_REMOTE" /tmp/lxmf && git -C /tmp/lxmf checkout -q "$LXMF_PIN"
          retry 3 python -m pip install -q --upgrade pip
          retry 3 python -m pip install -q /tmp/rns pytest
          retry 3 python -m pip install -q --no-deps /tmp/lxmf
      - name: Reticulum RF-log decoder tests
        run: pytest -q -rs lhpc/data/rfdecode/tests/test_reticulum_decoder.py
