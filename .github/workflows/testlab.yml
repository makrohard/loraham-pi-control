# The test-lab CI lane: the lab's three test lanes — unit (the simulator itself), acceptance
# (the real executable and server over simulated hardware) and browser (real headless Chromium)
# — run INSIDE a lab image built from THIS commit's devcontainer Dockerfile, so the image deps
# always match the checkout. ci.yml is untouched; this is its own independent check.
name: testlab

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:        # a release branch is checked by dispatching on its ref

permissions:
  contents: read

concurrency:
  group: testlab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testlab:
    runs-on: ubuntu-24.04-arm   # aarch64: matches the Pi + our lhpc-binaries artifacts
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the lab image from THIS commit's Dockerfile
        # Build (never pull) so the image deps always match the checkout — a stale
        # published `latest` (e.g. racing the image-publish workflow) would miss deps a
        # new commit added and fail spuriously. The image is built with no build arguments;
        # the heavy acceptance lane below boots the binary meshcom and meshtastic legs on
        # this native aarch64 runner.
        run: |
          IMG=lhpc-testlab:ci
          docker build -t "$IMG" -f .devcontainer/Dockerfile .devcontainer
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: Run the lab lanes in the image
        # Root copies the checkout in and DROPS to the unprivileged lab user — the
        # same privilege boundary users get (uid mapping of -v mounts is not assumed).
        run: |
          docker run --rm --user root -v "$PWD":/repo:ro \
            -v lhpc_lab_tmp:/tmp \
            "$IMG" bash -lc '
              set -e
              cp -r /repo /tmp/repo && chown -R lhpclab /tmp/repo
              su lhpclab -c "
                set -e
                cd /tmp/repo
                export LHPC_SYSTEM_PROVIDER=lhpc_testlab.provider:build
                python3 -m venv /tmp/venv && . /tmp/venv/bin/activate
                pip install -q -e .            # the product
                pip install -q -e ./testlab    # the SEPARATE lab package
                pip install -q pytest playwright
                python -m playwright install chromium
                # A virtual display for the ACCEPTANCE lane only: voice and sideband are
                # GTK/Kivy programs, and without one the lab would skip starting them
                # instead of proving they start. The browser lane below runs with no
                # DISPLAY at all — headless Chromium needs no desktop.
                (Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &)
                python -m pytest testlab/tests/unit -q
                # LHPC_CHAIN_HEAVY=1: this runner is NATIVE aarch64 (not nested emulation),
                # so the binary meshcom (qemu-system-xtensa) and meshtastic START legs can
                # actually boot and be verified here — proving every stack starts.
                DISPLAY=:99 LHPC_ACCEPTANCE=1 LHPC_CHAIN_HEAVY=1 \
                  python -m pytest testlab/tests/acceptance -q -rs
                LHPC_BROWSER=1 python -m pytest testlab/tests/browser -q -rs"'
