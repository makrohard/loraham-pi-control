# The test-lab CI lane: the lab's three test lanes — unit (the simulator itself), acceptance
# (the real executable and server over simulated hardware) and browser (real headless Chromium)
# — run INSIDE a lab image built from THIS commit's devcontainer Dockerfile, so the image deps
# always match the checkout. ci.yml is untouched; this is its own independent check.
#
# `release-verify` is a SECOND, heavier job: every stack a pin release may move, installed at
# the selected commit, built, started and proved to BE that commit. It runs on pushes to `main`
# and on dispatch with `release_verify=true` — an automated pin release dispatches it on its
# candidate branch. It is deliberately NOT on `dev` or on a pull request: it installs and builds
# everything, and a commit nobody is about to release does not need that proof.
name: testlab

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:        # a release branch is checked by dispatching on its ref
    inputs:
      release_verify:
        description: "also run the release-verification lane (every stack installed, built, started, identity-proved)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testlab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testlab:
    runs-on: ubuntu-24.04-arm   # aarch64: matches the Pi + our lhpc-binaries artifacts
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the lab image from THIS commit's Dockerfile
        # Build (never pull) so the image deps always match the checkout — a stale
        # published `latest` (e.g. racing the image-publish workflow) would miss deps a
        # new commit added and fail spuriously. The image is built with no build arguments;
        # the heavy acceptance lane below boots the binary meshcom and meshtastic legs on
        # this native aarch64 runner.
        run: |
          IMG=lhpc-testlab:ci
          docker build -t "$IMG" -f .devcontainer/Dockerfile .devcontainer
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: Run the lab lanes in the image
        # Root copies the checkout in and DROPS to the unprivileged lab user — the
        # same privilege boundary users get (uid mapping of -v mounts is not assumed).
        run: |
          docker run --rm --user root -v "$PWD":/repo:ro \
            -v lhpc_lab_tmp:/tmp \
            "$IMG" bash -lc '
              set -e
              cp -r /repo /tmp/repo && chown -R lhpclab /tmp/repo
              su lhpclab -c "
                set -e
                cd /tmp/repo
                export LHPC_SYSTEM_PROVIDER=lhpc_testlab.provider:build
                python3 -m venv /tmp/venv && . /tmp/venv/bin/activate
                # Sourced from the COPY inside the container: a helper sourced in the host shell
                # does not survive docker run, let alone the su below.
                . /tmp/repo/.github/scripts/retry.sh
                retry 3 pip install -q -e .            # the product
                retry 3 pip install -q -e ./testlab    # the SEPARATE lab package
                retry 3 pip install -q pytest playwright
                retry 3 python -m playwright install chromium
                # A virtual display for the ACCEPTANCE lane only: voice and sideband are
                # GTK/Kivy programs, and without one the lab would skip starting them
                # instead of proving they start. The browser lane below runs with no
                # DISPLAY at all — headless Chromium needs no desktop.
                (Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &)
                python -m pytest testlab/tests/unit -q
                # LHPC_CHAIN_HEAVY=1: this runner is NATIVE aarch64 (not nested emulation),
                # so the binary meshcom (qemu-system-xtensa) and meshtastic START legs can
                # actually boot and be verified here — proving every stack starts.
                DISPLAY=:99 LHPC_ACCEPTANCE=1 LHPC_CHAIN_HEAVY=1 \
                  python -m pytest testlab/tests/acceptance -q -rs
                LHPC_BROWSER=1 python -m pytest testlab/tests/browser -q -rs"'

      - name: Collect the lab's own logs (also on failure)
        # Without this a red lane leaves nothing behind: the runtime roots live inside the
        # container's /tmp volume, and the pytest tail alone never says WHICH build or start
        # failed. Named per job — two jobs uploading `testlab-logs` would collide.
        if: always()
        run: |
          mkdir -p labevidence
          docker run --rm --user root -v lhpc_lab_tmp:/tmp -v "$PWD/labevidence":/out \
            "${IMG:-lhpc-testlab:ci}" bash -lc '
              set +e
              find /tmp -maxdepth 6 \( -type d -name logs -o -type d -name testlab \) \
                   -not -path "*/site-packages/*" -print0 \
                | while IFS= read -r -d "" d; do
                    dest="/out/$(echo "${d#/tmp/}" | tr "/" "_")"
                    mkdir -p "$dest" && cp -r "$d"/. "$dest"/ 2>/dev/null
                  done
              chmod -R a+rX /out 2>/dev/null; true' || true
          du -sh labevidence 2>/dev/null || true

      - name: Upload the lab logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testlab-logs-testlab
          path: labevidence/**
          if-no-files-found: warn
          retention-days: 14

  release-verify:
    # Every stack an automated pin release may move: installed on its DEFAULT channel (the
    # published binary, else the manifest pin), built, started, verified, and finally proved
    # to be exactly the candidate manifest's commits. The daemon and RadioLib are the lab's
    # fixtures, so they are NOT proved here — their artifact is proved by the binary builder's
    # own smoke and clean-runtime test, and their pins move by hand.
    # `main` pushes and explicit dispatch only. It used to run on every push, including `dev`,
    # which spent half an hour proving a commit nobody was about to release and made the lane's
    # own description untrue.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.release_verify }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the lab image from THIS commit's Dockerfile
        run: |
          IMG=lhpc-testlab:ci
          docker build -t "$IMG" -f .devcontainer/Dockerfile .devcontainer
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      # The lane's script is written to a FILE and run, never nested inside quoted strings.
      # It was nested twice before, and both times a quote in a COMMENT broke it: an apostrophe
      # ended the outer single-quoted string and the job died, and a double quote ended the
      # inner one, so a truncated script installed the venv, exited 0 and never ran pytest at
      # all — a green lane that proved nothing. A heredoc has no such edge.
      #
      # No Xvfb is started here: the release lane OWNS its display (testlab/tests/release/
      # conftest.py), because one case must run with no graphical session to prove the Voice
      # terminal variant through the production start path.
      - name: Release verification
        run: |
          mkdir -p releaseevidence
          cat > lane.sh <<'LANE'
          set -e
          cd /tmp/repo
          export LHPC_SYSTEM_PROVIDER=lhpc_testlab.provider:build
          python3 -m venv /tmp/venv && . /tmp/venv/bin/activate
          . /tmp/repo/.github/scripts/retry.sh
          retry 3 pip install -q -e .
          retry 3 pip install -q -e ./testlab
          retry 3 pip install -q pytest
          # -x: STOP AT THE FIRST FAILURE. The lane chains stacks over one radio pair, so a
          # case that fails leaves the run in a state later cases cannot be judged in — and the
          # automated release reads this JUnit to decide which stack to freeze. Continuing
          # produced both wrong answers: a cleaned-up failure was followed by an unmarked
          # prerequisite failure, which made the consumer refuse a genuine freeze; and a failed
          # cleanup was followed by an innocent stack earning its own valid marker. Stopping
          # here bounds the run to its FIRST genuine regression. An aborted run can never
          # satisfy the publication gate anyway: that requires every required case to have
          # passed. Cleanup still runs (fixture teardown is unaffected by -x) and a failed stop
          # still surfaces as its own teardown error.
          DISPLAY=:99 LHPC_RELEASE_VERIFY=1 LHPC_CHAIN_HEAVY=1 \
            python -m pytest testlab/tests/release -q -rs -x \
              --junitxml=/out/junit-release.xml
          LANE
          docker run --rm --user root -v "$PWD":/repo:ro \
            -v lhpc_release_tmp:/tmp -v "$PWD/releaseevidence":/out \
            "$IMG" bash -lc '
              set -e
              cp -r /repo /tmp/repo && chown -R lhpclab /tmp/repo && chmod a+w /out
              install -m 0755 /repo/lane.sh /tmp/lane.sh
              su lhpclab -c /tmp/lane.sh
            '
          test -s releaseevidence/junit-release.xml \
            || { echo "::error::the lane produced no JUnit — it did not run"; exit 1; }

      - name: Collect the lab's own logs (also on failure)
        if: always()
        run: |
          docker run --rm --user root -v lhpc_release_tmp:/tmp -v "$PWD/releaseevidence":/out \
            "${IMG:-lhpc-testlab:ci}" bash -lc '
              set +e
              find /tmp -maxdepth 7 \( -type d -name logs -o -type d -name testlab \
                   -o -name "versions.txt" \) -not -path "*/site-packages/*" -print0 \
                | while IFS= read -r -d "" d; do
                    dest="/out/$(echo "${d#/tmp/}" | tr "/" "_")"
                    if [ -d "$d" ]; then mkdir -p "$dest" && cp -r "$d"/. "$dest"/ 2>/dev/null
                    else cp "$d" "$dest" 2>/dev/null; fi
                  done
              chmod -R a+rX /out 2>/dev/null; true' || true
          du -sh releaseevidence 2>/dev/null || true

      - name: Upload the release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testlab-logs-release-verify
          path: releaseevidence/**
          if-no-files-found: warn
          retention-days: 14

  slow-build:
    # Row C of the slow-target build proof (docs/maintenance.md, the slow-target build row): every
    # operation on the update path, run and timed under the PRODUCTION limits inside a container
    # throttled to a Pi Zero 2 W, then judged against tests/data/slow-target-builds.toml.
    # The same triggers as release-verify, so every release candidate, bot ones included.
    # test_slow_build_calibrated turns this job red while the container is faster than the Zero
    # on ANY part (cpu, io, mem) of the fixed calibration workload: then tighten that part's
    # throttle below; a throttle only ever gets tighter.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.release_verify }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    env:
      # The throttle. Measured: the Zero's calibration (row A, 2026-10-03) is cpu 99.7 s,
      # io 489.8 s, mem 110.1 s; this container at --cpus 0.5, --memory 416m and no disk
      # throttle took cpu 57.8, io 31.4, mem 12.2 (testlab run 37148794385): faster on all three.
      # CPU — the cpu part is CPU-time bound and scales with the quota: 0.5 x 57.8 / 99.7 =
      # 0.29 CPUs matches the Zero; 0.25 leaves ~15 %.
      SLOW_CPUS: "0.25"
      # Memory — what a Zero 2 W leaves free; the rest of the 700 MB mem part swaps (the Zero
      # swaps into zram). --memory-swap is memory + 768 MiB swap.
      SLOW_MEM: "416m"
      SLOW_SWAP: "1184m"
      # Disk — on every disk behind Docker's storage and swap. The io part is 65536 fsync'd
      # 4 KiB files: 489.8 s on the Zero's SD card, ~134 synced files/s. On a journaled ext4
      # each synced file costs ~1.2 writes charged to the container (measured), so 120 write
      # IOPS gives ~100 files/s, ~650 s. Reads also pace the mem part, whose swap-ins hit
      # the disk (the Zero swaps into zram instead): measured 608 s at 300 read IOPS, 186 s at
      # 1000, 97 s at 2000; 1200 keeps it above the Zero's 110 s. These are local measurements
      # (x86, cgroup v1, not the arm runner); the calibration case
      # of every run is the proof on the runner.
      SLOW_WRITE_IOPS: "120"
      SLOW_READ_IOPS: "1200"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the self-update case updates from the PREVIOUS release tag.
          fetch-depth: 0

      - name: Build the lab image from THIS commit's Dockerfile
        run: |
          IMG=lhpc-testlab:ci
          docker build -t "$IMG" -f .devcontainer/Dockerfile .devcontainer
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      # io.max takes whole disks. REQUIRED: the disk behind the container's writable layer,
      # where the calibration work dir under the lab user's home lives, and the disk behind
      # Docker's storage, which holds the /tmp volume. The writable layer is measured, not
      # assumed: a container from the lab image reports its root mount, and the overlay's
      # upperdir (a host path) is where a container's writes land; a root that is not an overlay
      # stops the job. Each disk resolves (as root: Docker's directories are root-only), or the
      # job STOPS here, before any measurement. The upperdir is resolved while that container
      # lives. `sudo -n` never prompts: the workflow grants no sudo, it relies on the hosted
      # ubuntu-24.04-arm runner's passwordless sudo; without it the required disks do not
      # resolve and the job stops. An active swap area's disk is throttled too, or skipped with
      # a notice. The lane re-checks io.max for the writable layer's disk (SLOW_IO_ROOT_DISK)
      # and the work dir's, and records nothing unless each is throttled.
      - name: Resolve the disks to throttle
        run: |
          # The whole disk behind a path or block device, as /dev/NAME; non-zero, naming the
          # path, when it cannot be resolved.
          disk_of() {
            local mm d
            if [ -b "$1" ]; then mm=$(lsblk -dno MAJ:MIN "$1" 2>/dev/null | tr -d ' ')
            else mm=$(sudo -n findmnt -n -o MAJ:MIN --target "$1" 2>/dev/null | head -1 | tr -d ' '); fi
            if [ -z "$mm" ] || [ ! -e "/sys/dev/block/$mm" ]; then
              echo "disk_of: backing device of $1 could not be resolved (MAJ:MIN ${mm:-none})" >&2
              return 1
            fi
            d=$(readlink -f "/sys/dev/block/$mm")
            [ -e "$d/partition" ] && d=$(dirname "$d")
            echo "/dev/$(basename "$d")"
          }
          cat /proc/swaps
          lsblk
          storage=$(docker info -f '{{.DockerRootDir}}')
          # The upperdir exists only while its container does (`--rm` deletes it at exit, and
          # findmnt resolves no missing path), so a container is kept alive until every
          # required disk has resolved, and removed on every way out of the step.
          # The trap exists before the container: `docker run -d` can print an id and still fail.
          cid= rc=0
          trap '[ -z "$cid" ] || docker rm -f "$cid" >/dev/null 2>&1; true' EXIT
          cid=$(docker run -d "$IMG" sleep 300) || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::STOP: the probe container did not start (docker run rc $rc)"
            exit 1
          fi
          layer=$(docker exec "$cid" cat /proc/self/mountinfo \
            | awk '$5 == "/"' | sed -n 's/.* - overlay .*[ ,]upperdir=\([^,]*\).*/\1/p')
          if [ -z "$layer" ]; then
            echo "::error::STOP: the lab container's root is not an overlay with an upperdir — its writable layer's disk cannot be measured"
            exit 1
          fi
          echo "writable layer (measured): $layer"
          disks=
          for path in "$layer" "$storage"; do
            d=$(disk_of "$path") && test -b "$d" || {
              echo "::error::STOP: backing device of $path could not be resolved — the throttle cannot be applied"
              exit 1
            }
            [ "$path" = "$layer" ] && root=$d
            disks="$disks $d"
          done
          docker rm -f "$cid" >/dev/null
          trap - EXIT
          while read -r swap _; do
            if d=$(disk_of "$swap") && test -b "$d"; then disks="$disks $d"
            else echo "::notice::swap $swap: its disk could not be resolved — not throttled"; fi
          done < <(tail -n +2 /proc/swaps)
          disks=$(printf '%s\n' $disks | sort -u | xargs)
          flags=
          for d in $disks; do
            flags="$flags --device-write-iops $d:$SLOW_WRITE_IOPS --device-read-iops $d:$SLOW_READ_IOPS"
          done
          echo "throttled disks: $disks (writable layer: $root)"
          echo "SLOW_IO_FLAGS=$flags" >> "$GITHUB_ENV"
          echo "SLOW_IO_ROOT_DISK=$(lsblk -dno MAJ:MIN "$root" | tr -d ' ')" >> "$GITHUB_ENV"

      # A heredoc lane script, as in release-verify. The container gets the throttle; the lane
      # itself checks that cpu.max, memory.max and io.max are in force and fails if they are not.
      - name: Slow-target build
        run: |
          mkdir -p slowevidence
          cat > lane.sh <<'LANE'
          set -e
          cd /tmp/repo
          export LHPC_SYSTEM_PROVIDER=lhpc_testlab.provider:build
          python3 -m venv /tmp/venv && . /tmp/venv/bin/activate
          . /tmp/repo/.github/scripts/retry.sh
          retry 3 pip install -q -e .
          retry 3 pip install -q -e ./testlab
          retry 3 pip install -q pytest
          # No -x: the budget case needs every measurement the run could make.
          LHPC_SLOW_BUILD=1 LHPC_SLOW_BUILD_OUT=/out \
            python -m pytest testlab/tests/slowbuild -q -rs \
              --junitxml=/out/junit-slow-build.xml
          LANE
          # shellcheck disable=SC2086  # SLOW_IO_FLAGS is a word list by design
          docker run --rm --user root \
            --cpus="$SLOW_CPUS" --memory="$SLOW_MEM" --memory-swap="$SLOW_SWAP" $SLOW_IO_FLAGS \
            -e SLOW_CPUS -e SLOW_MEM -e SLOW_WRITE_IOPS -e SLOW_READ_IOPS -e SLOW_IO_ROOT_DISK \
            -e LHPC_SLOW_BUILD_RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -v "$PWD":/repo:ro -v lhpc_slow_tmp:/tmp -v "$PWD/slowevidence":/out \
            "$IMG" bash -lc '
              set -e
              cp -r /repo /tmp/repo && chown -R lhpclab /tmp/repo && chmod a+w /out
              install -m 0755 /repo/lane.sh /tmp/lane.sh
              su lhpclab -c "SLOW_CPUS=$SLOW_CPUS SLOW_MEM=$SLOW_MEM SLOW_WRITE_IOPS=$SLOW_WRITE_IOPS SLOW_READ_IOPS=$SLOW_READ_IOPS SLOW_IO_ROOT_DISK=$SLOW_IO_ROOT_DISK LHPC_SLOW_BUILD_RUN_URL=$LHPC_SLOW_BUILD_RUN_URL /tmp/lane.sh"
            '
          test -s slowevidence/junit-slow-build.xml \
            || { echo "::error::the lane produced no JUnit — it did not run"; exit 1; }
          # A skip is not a pass: env, every stack and the self-update case must have run and
          # passed. Calibrated and budget too, except in the bootstrap state (the baseline holds
          # no measured entry yet), where each may skip with its named bootstrap reason only.
          python3 - slowevidence/junit-slow-build.xml tests/data/slow-target-builds.toml <<'PY'
          import sys
          import tomllib
          import xml.etree.ElementTree as ET
          cases = {c.get("name"): c for c in ET.parse(sys.argv[1]).iter("testcase")}
          with open(sys.argv[2], "rb") as f:
              boot = not tomllib.load(f).get("measured")
          def state(name):
              if name not in cases:
                  return "missing", ""
              for tag in ("failure", "error", "skipped"):
                  el = cases[name].find(tag)
                  if el is not None:
                      return tag, el.get("message") or ""
              return "passed", ""
          rowc = sorted(n for n in cases if n.startswith("test_slow_build_stack["))
          need = ["test_slow_build_env", *rowc, "test_slow_build_selfupdate",
                  "test_slow_build_calibrated", "test_slow_build_budget"]
          bad = [] if rowc else ["test_slow_build_stack[*] (missing)"]
          for n in need:
              st, msg = state(n)
              if st == "passed" or (boot and st == "skipped" and "bootstrap: no row A yet" in msg
                                    and n in ("test_slow_build_calibrated",
                                              "test_slow_build_budget")):
                  continue
              bad.append(f"{n} ({st})")
          if bad:
              print("::error::not passed (missing, skipped or failed): " + ", ".join(bad))
              sys.exit(1)
          if boot:
              print("::warning::bootstrap: no row A yet — the Zero baseline is unmeasured; "
                    "row C judged this run only")
          PY

      - name: Job summary
        if: always()
        run: |
          if [ -f slowevidence/slow-build-summary.md ]; then
            cat slowevidence/slow-build-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the slow-build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slow-build-evidence
          path: slowevidence/**
          if-no-files-found: warn
          retention-days: 90
